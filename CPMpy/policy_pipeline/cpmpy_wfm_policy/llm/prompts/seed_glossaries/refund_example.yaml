# Reference glossary (YAML) for domains/refund_example signature — seed for Glossary Drafter few-shots.
# Order: enums, scalars, tool parameters, helpers (per signature_drafter prompt).

KYC_STATUS:
  type: enum
  description: Maps symbolic KYC outcomes to integer codes used when the rules refer to customer verification status and whether a refund may proceed.
  value_meanings:
    0: Customer KYC is in the VERIFIED state as described in the refund rules.
    1: Customer KYC is in the FAILED state as described in the refund rules.
  example_nl_phrases:
    - A refund call is not permitted if the affected customer's KYC status is FAILED.
    - A refund call is not permitted if the affected customer's KYC status is FAILED.

REFUND_TYPE:
  type: enum
  description: Distinguishes merchant refund versus goodwill credit paths referenced when the rules constrain proposed amounts and goodwill totals.
  value_meanings:
    0: Merchant refund path for the tool call.
    1: Goodwill credit path for the tool call.
  example_nl_phrases:
    - A merchant refund call with an amount greater than the referenced transaction's amount is not permitted.
    - A goodwill credit call with an amount greater than ten thousand pence is not permitted.

TRANSACTION_STATUS:
  type: enum
  description: Encodes whether the referenced transaction is POSTED or PENDING for rules that require POSTED before a refund.
  value_meanings:
    0: Transaction has status POSTED in the sense used by the refund rules.
    1: Transaction has status PENDING in the sense used by the refund rules.
  example_nl_phrases:
    - A refund call requires that the referenced transaction has status POSTED.
    - A refund call requires that the referenced transaction has status POSTED.

customer_kyc_status:
  type: scalar_field
  description: Integer-coded KYC state of the affected customer; the rules tie FAILED status to blocking refund calls.
  example_nl_phrases:
    - A refund call is not permitted if the affected customer's KYC status is FAILED.
    - A refund call is not permitted if the affected customer's KYC status is FAILED.

customer_vulnerable_flag:
  type: scalar_field
  description: Boolean flag indicating whether the affected customer is flagged vulnerable; combined with amount caps in the rules.
  example_nl_phrases:
    - A refund call is not permitted if the affected customer's vulnerable flag is set to true and the proposed refund amount exceeds twenty thousand pence.
    - A refund call is not permitted if the affected customer's vulnerable flag is set to true and the proposed refund amount exceeds twenty thousand pence.

customer_recent_goodwill_total:
  type: scalar_field
  description: Running total of recent goodwill credits for the customer in pence; used with proposed amount against the fifty thousand pence cap.
  example_nl_phrases:
    - A goodwill credit call is not permitted if the sum of the affected customer's recent goodwill credit total and the proposed amount exceeds fifty thousand pence.
    - A goodwill credit call is not permitted if the sum of the affected customer's recent goodwill credit total and the proposed amount exceeds fifty thousand pence.

account_has_sanctions_block:
  type: scalar_field
  description: Whether the affected account has its sanctions block flag set; rules forbid refunds when this is true.
  example_nl_phrases:
    - A refund call is not permitted if the affected account has its sanctions block flag set to true.
    - A refund call is not permitted if the affected account has its sanctions block flag set to true.

transaction_amount_pence:
  type: scalar_field
  description: Amount of the referenced transaction in pence; merchant refund amount must not exceed this value per the rules.
  example_nl_phrases:
    - A merchant refund call with an amount greater than the referenced transaction's amount is not permitted.
    - A merchant refund call with an amount greater than the referenced transaction's amount is not permitted.

transaction_status:
  type: scalar_field
  description: Integer-coded status of the referenced transaction; POSTED is required before allowing a refund call.
  example_nl_phrases:
    - A refund call requires that the referenced transaction has status POSTED.
    - A refund call requires that the referenced transaction has status POSTED.

refund_call_amount_pence:
  type: tool_parameter
  description: The proposed refund amount from the current gated refund tool call, in pence, used across merchant and goodwill rules.
  example_nl_phrases:
    - A merchant refund call with an amount greater than the referenced transaction's amount is not permitted.
    - A goodwill credit call with an amount greater than ten thousand pence is not permitted.

refund_call_type:
  type: tool_parameter
  description: Integer-coded refund type for the current tool call; distinguishes merchant refund versus goodwill credit paths in the rules.
  example_nl_phrases:
    - A merchant refund call with an amount greater than the referenced transaction's amount is not permitted.
    - A goodwill credit call with an amount greater than ten thousand pence is not permitted.

customer_kyc_failed:
  type: helper
  description: True when the customer's KYC status equals the FAILED enum code, matching NL that forbids refunds on FAILED KYC.
  derives_from:
    - customer_kyc_status
    - KYC_STATUS
  example_nl_phrases:
    - A refund call is not permitted if the affected customer's KYC status is FAILED.
    - A refund call is not permitted if the affected customer's KYC status is FAILED.

transaction_is_posted:
  type: helper
  description: True when the referenced transaction has POSTED status as encoded by TRANSACTION_STATUS and transaction_status.
  derives_from:
    - transaction_status
    - TRANSACTION_STATUS
  example_nl_phrases:
    - A refund call requires that the referenced transaction has status POSTED.
    - A refund call requires that the referenced transaction has status POSTED.

refund_is_merchant:
  type: helper
  description: True when the current refund call is a merchant refund path per refund_call_type and REFUND_TYPE.
  derives_from:
    - refund_call_type
    - REFUND_TYPE
  example_nl_phrases:
    - A merchant refund call with an amount greater than the referenced transaction's amount is not permitted.
    - A merchant refund call with an amount greater than the referenced transaction's amount is not permitted.

refund_is_goodwill:
  type: helper
  description: True when the current refund call is a goodwill credit path per refund_call_type and REFUND_TYPE.
  derives_from:
    - refund_call_type
    - REFUND_TYPE
  example_nl_phrases:
    - A goodwill credit call with an amount greater than ten thousand pence is not permitted.
    - A goodwill credit call is not permitted if the sum of the affected customer's recent goodwill credit total and the proposed amount exceeds fifty thousand pence.
