[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "autov-workspace"
version = "0.0.0"
description = "AutoV workspace (ASP + SMT pipelines, WFM, registry)."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.6,<3",
    "z3-solver>=4.12.0",
]

[project.scripts]
validate-policy = "agentsim.runtime.validate_policy:main"
verify-guardrails = "agentsim.runtime.guardrails_cli:main"
agentsim-simpl-demo = "agentsim_simplified.runner:main"

[tool.setuptools]
packages = [
    "registry_stage",
    "wfm_orchestration",
    "asp_pipeline",
    "smt_pipeline",
    "agentsim",
    "agentsim.runtime",
    "agentsim.runtime.data",
    "agentsim_simplified",
    "agentsim_simplified.data",
    "agentsim_simplified.tests",
]

[tool.setuptools.package-data]
"agentsim.runtime.data" = ["*.json", "*.smt2"]
"agentsim_simplified.data" = ["*.json"]

[tool.setuptools.package-dir]
"registry_stage" = "registry_stage"
"wfm_orchestration" = "wfm_orchestration"
"asp_pipeline" = "asp/asp_pipeline"
"smt_pipeline" = "smt/smt_pipeline"
"agentsim" = "agentsim"
"agentsim.runtime" = "agentsim/runtime"
"agentsim.runtime.data" = "agentsim/runtime/data"
"agentsim_simplified" = "agentsim_simplified"
"agentsim_simplified.data" = "agentsim_simplified/data"
"agentsim_simplified.tests" = "agentsim_simplified/tests"

[tool.pytest.ini_options]
testpaths = [
    "asp/asp_pipeline/tests",
    "smt/smt_pipeline/tests",
    "registry_stage/tests",
    "wfm_orchestration/tests",
    "agentsim_simplified/tests",
    "agentsim/tests",
]
